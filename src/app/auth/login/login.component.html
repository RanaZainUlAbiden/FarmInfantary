<main class="auth-screen">
  <section class="auth-card" aria-labelledby="login-title">
    <div class="auth-brand">
      <img src="/logo.png?v=20261026" alt="" width="100" height="100" class="auth-logo" />
      <h1 id="login-title">FarmInfantary</h1>
      <p>Farm Management System</p>
    </div>
    <div *ngIf="checking" class="auth-loading" role="status" aria-live="polite">Checking your sign-in…</div>
    <form *ngIf="!checking" class="auth-form" novalidate (ngSubmit)="onLogin()" (keydown.enter)="onEnter($event)" [attr.aria-busy]="busy">
      <div class="auth-field">
        <label for="username">Username</label>
        <input #usernameInput id="username" name="username" type="text" autocomplete="username" autocapitalize="none"
          spellcheck="false" maxlength="64" [(ngModel)]="username" [disabled]="busy || auth.logoutPending"
          [attr.aria-invalid]="usernameInvalid" aria-describedby="username-help login-error" />
        <p id="username-help" class="auth-help">Use the username provided by your administrator.</p>
      </div>
      <app-password-field inputId="login-password" label="Password" [(value)]="password"
        [disabled]="busy || auth.logoutPending" [invalid]="!!passwordInvalid" describedBy="login-error" />
      <p id="login-error" class="auth-error" role="alert" aria-live="polite">{{ errorMessage }}</p>
      <button class="auth-primary" type="submit" [disabled]="busy || auth.logoutPending">
        {{ busy ? 'Signing in…' : 'Sign in' }}
      </button>
      <div class="auth-recovery">
        <button *ngIf="auth.logoutPending" type="button" class="auth-secondary" [disabled]="busy" (click)="retryLogout()">Retry sign-out</button>
        <button *ngIf="errorMessage && !auth.logoutPending" type="button" class="auth-link" [disabled]="busy" (click)="restore(true)">Check sign-in again</button>
      </div>
      <p class="auth-help auth-guidance">Need an account or help signing in? Contact your administrator.</p>
    </form>
  </section>
</main>
