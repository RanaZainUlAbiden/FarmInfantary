<div class="auth-field">
  <label [for]="inputId">{{ label }}</label>
  <div class="password-control">
    <input #passwordInput [id]="inputId" [name]="inputId" [type]="visible ? 'text' : 'password'" [value]="value"
      [autocomplete]="autocomplete" [disabled]="disabled" [attr.aria-invalid]="invalid" [attr.aria-describedby]="describedBy || null"
      (input)="onInput($event)" maxlength="256" />
    <button type="button" class="password-toggle" [disabled]="disabled" [attr.aria-label]="visible ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="visible" (click)="toggleVisibility()">{{ visible ? 'Hide' : 'Show' }}</button>
  </div>
</div>
