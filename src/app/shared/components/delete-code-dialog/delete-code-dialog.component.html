<dialog #dialog class="dialog-overlay" aria-labelledby="delete-code-title" aria-describedby="delete-code-help" (cancel)="$event.preventDefault();cancel()" (keydown)="trapTab($event)">
 <div class="dialog-box">
  <div class="dialog-icon danger" aria-hidden="true">🔒</div>
  <h3 id="delete-code-title" class="dialog-title">Delete code required</h3>
  <p id="delete-code-help" class="dialog-message">This action deletes data permanently. Confirm your delete code to allow deletes on this device for 60 seconds.</p>
  <form novalidate (ngSubmit)="submit()" (keydown.enter)="onEnter($event)">
   <app-password-field inputId="delete-confirmation-code" label="Delete code" [value]="code" (valueChange)="setCode($event)" [disabled]="isVerifying" [invalid]="!!error" describedBy="delete-code-error" />
   <p id="delete-code-error" class="code-error" role="alert">{{error}}</p>
   <div class="dialog-actions"><button type="button" class="btn-cancel" (click)="cancel()">Cancel</button><button type="submit" class="btn-confirm danger" [disabled]="isVerifying || !code.trim()">{{isVerifying?'Checking…':'Confirm delete code'}}</button></div>
  </form>
 </div>
</dialog>
