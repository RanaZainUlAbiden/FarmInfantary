<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Talha Protein Farm</title>
  <!-- ABSOLUTE, not "./".
       The desktop app loaded this file from disk over file:// and always
       opened at the index, so a relative base was fine and deep URLs never
       existed. On the web, "./" resolves against the CURRENT path: at
       /app/sale the browser asks for /app/main.js, gets a 404, and the app
       never boots — a white page on every refresh and every shared link. -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6d45">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
